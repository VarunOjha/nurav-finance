<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1A1918" />
    <title>Nurav Finance</title>
    <script>
      // Apply the saved theme before first paint (see src/lib/theme.ts).
      ;(function () {
        var modes = { paper: 'light', fog: 'light', linen: 'light', dusk: 'dark', ink: 'dark' }
        var choice = 'system'
        try { choice = localStorage.getItem('nurav-theme') || 'system' } catch (e) {}
        if (!modes[choice]) choice = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'ink' : 'paper'
        document.documentElement.dataset.theme = choice
        document.documentElement.dataset.mode = modes[choice]
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
